[project]
name = "plain.testing"
version = "0.1.0"
description = "Write and run tests for a Plain app."
authors = [{ name = "Dave Gaeddert", email = "dave.gaeddert@dropseed.dev" }]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["plain>=0.165.0,<1.0.0", "click>=8.0.0", "opentelemetry-sdk>=1.34.1"]

[project.entry-points."plain.cli"]
test = "plain.testing.runner.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["plain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
