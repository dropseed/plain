# Review configuration for the Plain framework monorepo.
#
# Most PRs here are opened by agents under the maintainer's own GitHub
# account. PullApprove never counts an author's review toward `require`, so
# `require` stays 0 for now — the scope requests review and carries
# instructions, but does not hard-block. Once agents open PRs under a separate
# bot identity, raise this to `require = 1`.

# claude-code-review.yml reviews every non-draft PR from this repo and always
# ends by submitting a review, clean or not — so the review request below waits
# until Claude has looked. The maintainer opens the PR and comes back to a
# review already on it, instead of racing the bot to the same findings.
#
# Copilot stays undeclared — it is opt-in per pull request, so it may never
# answer, and an agent that never answers holds the request forever.
#
# Fork PRs skip both workflows entirely and will sit held; there have been none
# here, and the fix if that changes is to drop the declarations rather than work
# around it.
[[agents]]
account = "claude[bot]"

# The Codex adapter, not Codex. Codex itself cannot be declared: it emits no
# check run, and its clean result is a reaction rather than a review, so there
# is nothing for PullApprove to read. codex-outcome.yml watches what Codex does
# leave behind — a review, or a comment — and reports under this account, and
# claude-code-review.yml reports here too when the handoff is skipped. Between
# them every path reports, which is what makes it safe to wait on.
#
# Both write the `codex-review` check run rather than a review, because only a
# check run can conclude `skipped` — "no answer is coming". As reviews, the two
# no-answer paths (Codex out of quota, handoff never made) read as "Codex
# looked at it". The check name is matched together with the producing App, so
# an unrelated workflow can't answer for this agent by picking the name.
#
# Reviews are still read as a fallback channel, so this does still count ANY
# review from github-actions[bot] — nothing else in this repo should post one.
# Claude posts as claude[bot] via its own app.
[[agents]]
account = "github-actions[bot]"
check = "codex-review"

[[scopes]]
name = "all"
description = "Everything in the monorepo — framework core, packages, tooling, and docs."
paths = ["**/*"]
reviewers = ["davegaeddert"]
require = 0
request = 1
