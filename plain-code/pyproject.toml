[project]
name = "plain.code"
version = "0.24.0"
description = "Preconfigured code formatting and linting."
authors = [{ name = "Dave Gaeddert", email = "dave.gaeddert@dropseed.dev" }]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.13"
dependencies = [
  "plain>=0.155.0,<1.0.0",
  # Bounded so every checkout and every app lints with the same rule set —
  # ruff adds rules (and import-sort tweaks) in minor releases.
  "ruff>=0.16.2,<0.17",
  "ty<1.0.0",
  "httpx>=0.27",
  "tomlkit>=0.11.0",
]

# Make this available as a standalone command
# in case plain can't load or something (this can run anyways)
[project.scripts]
plain-code = "plain.code:cli"

[project.entry-points."plain.setup"]
"code-setup" = "plain.code.entrypoints:setup"

[tool.hatch.build.targets.wheel]
packages = ["plain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
