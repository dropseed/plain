target-version = "py313"

# Ruff's default rules are deliberately in play — when a new ruff version
# expands them, we address what it finds rather than freezing the set.
# Determinism comes from plain-code's bounded ruff dependency: everyone on
# the same plain-code release lints with the same ruff.

[lint]
extend-select = [
  "ISC", # flake8-implicit-str-concat
  "PT", # pytest
]
ignore = [
  "ISC001", # Implicit string concatenation (conflicts with the formatter)
  # getattr/setattr with a literal name is how dynamic-attribute code stays
  # honest with the type checker — the "fix" trades a lint for a ty error.
  "B009", # get-attr-with-constant
  "B010", # set-attr-with-constant
  # Broad catches at error boundaries and in best-effort cleanup are design,
  # not accidents — narrow where the failure set is known, and comment the
  # rest in place. Flagging every boundary would just breed noqa comments.
  "BLE001", # blind-except
  "S110", # try-except-pass
  "S112", # try-except-continue
]
