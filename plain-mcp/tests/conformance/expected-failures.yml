# Baseline of MCP conformance checks that plain-mcp does not pass.
#
# Two entry forms, and the difference matters:
#
#   - `scenario`          — a wildcard. Exempts every check in the scenario,
#                           and only goes stale once the whole scenario passes.
#                           Right for a feature we haven't built: naming its
#                           checks one by one just restates the scenario in
#                           more words.
#   - `scenario:check-id` — exempts that check alone, so a *different* check in
#                           the same scenario failing still counts as a
#                           regression. Right for a scenario that partly
#                           passes. None currently do.
#
# The CLI rejects mixing the two forms for one scenario, so a scenario is
# either wholly exempt or listed check by check.
#
# Exit-code semantics (--expected-failures):
#   fail + expected  -> exit 0
#   fail + unexpected -> exit 1  (regression)
#   pass + expected  -> exit 1  (stale baseline)
#   pass + unexpected -> exit 0  (normal pass)

server:
  # SEP-2243 `x-mcp-header` / `Mcp-Param-*`: a schema can mark an input as
  # travelling in its own HTTP header, and the server validates it there.
  # Deferred, and inert until there's a tool-side API to declare it — the
  # server half alone would be a validator with nothing to validate. Optional
  # for servers, so this is a feature gap, not a violation.
  - http-custom-header-server-validation

  # Completions — not implemented.
  - completion-complete

  # Progress notifications on tools/call — not implemented.
  - tools-call-with-progress

  # SEP-2322 mid-request input (MRTR): a tool pauses, asks the client for
  # elicitation / sampling / roots, and resumes from carried state. Not
  # implemented — it's the stateless protocol's replacement for the old
  # server-to-client stream, and a sizable feature in its own right.
  - input-required-result-basic-elicitation
  - input-required-result-basic-sampling
  - input-required-result-basic-list-roots
  - input-required-result-request-state
  - input-required-result-multiple-input-requests
  - input-required-result-multi-round
  - input-required-result-missing-input-response
  - input-required-result-non-tool-request
  - input-required-result-result-type
  - input-required-result-tampered-state
  - input-required-result-capability-check
  - input-required-result-validate-input
